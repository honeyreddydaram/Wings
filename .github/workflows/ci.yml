name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      APP_MODE: demo
      DATABASE_PATH: /tmp/cowingman-ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: pytest backend -q

  mobile:
    runs-on: ubuntu-latest
    env:
      EXPO_HOME: /tmp/wings-expo
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.4'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --prefix mobile
      - run: npm test --prefix mobile
      - run: npm run typecheck --prefix mobile
      - run: npm run build --prefix mobile
      - run: npx expo export --platform android --output-dir /tmp/wings-android-export
        working-directory: mobile
