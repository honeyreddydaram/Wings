AWSTemplateFormatVersion: "2010-09-09"
Description: Co-Wingman backend and web hosting

Parameters:
  ImageIdentifier:
    Type: String
    Default: ""
    Description: Full ECR image URI, including tag. Leave empty for the foundation deployment.
  GeminiApiKey:
    Type: String
    NoEcho: true
    Default: ""
  GroqApiKey:
    Type: String
    NoEcho: true
    Default: ""
  GeminiModel:
    Type: String
    Default: gemini-2.5-flash

Conditions:
  DeployApplication: !Not [!Equals [!Ref ImageIdentifier, ""]]

Resources:
  ContainerRepository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Keep 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}

  SessionTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

  SummaryBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireSummaries
            Status: Enabled
            ExpirationInDays: 30

  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !Ref WebAccessControl
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  GeminiSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployApplication
    Properties:
      Description: Gemini API key for Co-Wingman
      SecretString: !Ref GeminiApiKey

  GroqSecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployApplication
    Properties:
      Description: Groq API key for Co-Wingman
      SecretString: !Ref GroqApiKey

  AppRunnerEcrRole:
    Type: AWS::IAM::Role
    Condition: DeployApplication
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: build.apprunner.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Condition: DeployApplication
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CoWingmanData
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem, dynamodb:DescribeTable]
                Resource: !GetAtt SessionTable.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${SummaryBucket.Arn}/summaries/*"
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref GeminiSecret
                  - !Ref GroqSecret

  AppRunnerService:
    Type: AWS::AppRunner::Service
    Condition: DeployApplication
    Properties:
      HealthCheckConfiguration:
        Path: /healthz
        Protocol: HTTP
        HealthyThreshold: 1
        UnhealthyThreshold: 5
        Interval: 10
        Timeout: 5
      InstanceConfiguration:
        Cpu: 1 vCPU
        Memory: 2 GB
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      SourceConfiguration:
        AutoDeploymentsEnabled: false
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerEcrRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageIdentifier
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: "8000"
            RuntimeEnvironmentVariables:
              - Name: APP_MODE
                Value: live
              - Name: DYNAMODB_TABLE
                Value: !Ref SessionTable
              - Name: SUMMARY_BUCKET
                Value: !Ref SummaryBucket
              - Name: GEMINI_MODEL
                Value: !Ref GeminiModel
              - Name: CORS_ORIGINS
                Value: !Sub "https://${WebDistribution.DomainName}"
            RuntimeEnvironmentSecrets:
              - Name: GEMINI_API_KEY
                Value: !Ref GeminiSecret
              - Name: GROQ_API_KEY
                Value: !Ref GroqSecret

Outputs:
  EcrRepositoryUri:
    Value: !GetAtt ContainerRepository.RepositoryUri
  WebBucketName:
    Value: !Ref WebBucket
  WebDistributionId:
    Value: !Ref WebDistribution
  WebUrl:
    Value: !Sub "https://${WebDistribution.DomainName}"
  ApiUrl:
    Condition: DeployApplication
    Value: !Sub "https://${AppRunnerService.ServiceUrl}"
